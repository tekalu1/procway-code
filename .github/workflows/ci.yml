# Public CI for the procway-code repo — injected by scripts/publish-sync.mjs
# (do not edit in the public repo; the next sync overwrites it).
#
# procway-code is standalone: single-importer pnpm lockfile at the repo root,
# runtime dependency = undici only. `pnpm install && pnpm test` is the whole story.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan over the checked-out tree. Pinned binary + checksum — needs no
  # secrets, runs on a fresh public runner. Config: .gitleaks.toml (repo root,
  # synced from the monorepo's ai-agent/.gitleaks.toml).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks 8.24.3 (pinned + checksum)
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan checked-out tree
        run: /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

  test:
    name: lint + vitest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install -g pnpm@9.15.4 && pnpm --version
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
