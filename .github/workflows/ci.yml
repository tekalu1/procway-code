# Lint + tests + a secret scan, on every pull request and every push to main.
#
# procway-code is a standalone repository: `pnpm-lock.yaml` sits at the root
# with a single importer and `undici` as the only runtime dependency, so
# `pnpm install --frozen-lockfile` resolves with no workspace context. Every
# path below is repository-root relative for the same reason.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scan over the checked-out tree. Pinned binary + checksum — needs no
  # secrets, runs on a fresh public runner. Config: .gitleaks.toml at the root.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks 8.24.3 (pinned + checksum)
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan checked-out tree
        run: /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

  test:
    name: lint + vitest (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # `engines.node` is ">=20", so every supported major is exercised.
        node: ["20", "22", "24"]
        include:
          # procway-code is a terminal program people also run on macOS, and
          # several paths branch on the platform: the OS keychain, the ulimit
          # sandbox prefix, and the iTerm2/WezTerm writers behind
          # `/terminal-setup`. One macOS job covers them without tripling the
          # bill. The pty scenarios skip there — they need util-linux
          # `script(1)`, whose BSD namesake takes different arguments.
          - os: macos-latest
            node: "22"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - name: Exports with no runtime caller (advisory)
        # Report only, never fails the build: it exists so a reviewer can see
        # in the log when something was exported, unit-tested, and then never
        # called by the program — the way `renderToolCall` once was.
        run: pnpm lint:exports
