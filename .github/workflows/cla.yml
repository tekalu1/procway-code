# CLA workflow (CLA Assistant Lite) — injected by scripts/publish-sync.mjs
# (do not edit in the public repo; the next sync overwrites it).
#
# Contributors sign the Procway Individual CLA (docs/legal/CLA.md) by posting
# the sign comment on their PR; signatures are recorded as a JSON file that
# this action commits BACK into this repo.
#
# CRITICAL — signatures live on the dedicated `cla-signatures` branch, NEVER
# on `main`: publish-sync full-replaces the tracked content of `main` on every
# sync (squash from the monorepo), so anything the bot committed to `main`
# would be wiped by the next sync. The `cla-signatures` branch is not touched
# by publish-sync and therefore survives syncs. Do not change `branch:` below.
#
# Keep this template byte-identical to its procway-code twin
# (guard: dashboard/tests/open-core/lockstep.test.ts) — it is repo-agnostic
# via ${{ github.repository }}, and both repos carry the CLA document at
# docs/legal/CLA.md.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  # Minimal set required by contributor-assistant/github-action:
  # contents: write   — commit signatures to the cla-signatures branch
  # pull-requests: write — comment on / label the PR
  # statuses: write   — set the CLA commit status
  # actions: write    — re-trigger the workflow after a signature
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the v2.6.1 release commit (supply-chain pin, same policy as
        # the gitleaks pin in ci.yml).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          # GITHUB_TOKEN only — no PAT. Signatures are stored in THIS repo, so
          # the default workflow token is sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/docs/legal/CLA.md
          # Dedicated branch — survives publish-sync main replacement (see header).
          branch: cla-signatures
          allowlist: '*[bot]'
