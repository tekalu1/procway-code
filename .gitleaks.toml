# gitleaks config for the public `procway-code` repo (ai-agent/ is promoted to
# that repo's root, so this file lands at its root and its CI `secret-scan`
# job picks it up). COPY of the monorepo root .gitleaks.toml — keep in
# lockstep (guard: dashboard/tests/open-core/lockstep.test.ts). Inside the
# monorepo this file is inert (the root config governs).

title = "procway secret scan"

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures and known non-secrets"
paths = [
  # dependency/build trees (local runs; CI checkouts are clean)
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''(^|/)(\.output|\.nuxt|dist|coverage)/''',
]
regexes = [
  # RFC 6455 §1.3 sample WebSocket nonce ("the sample nonce", public constant)
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # GitHub OAuth App client IDs — public information by design (the secret is
  # the client_secret, which is never committed)
  '''^[IO]v23[A-Za-z0-9]{16,}$''',
  # deploy.sh log message "secrets: Infisical/ESO モード…" (generic-api-key FP)
  '''^Infisical/ESO$''',
  # Synthetic fixtures in the secret-REDACTION test suites
  # (tests/redaction.test.mjs, mask-secrets.test.mjs). Pinned to the EXACT
  # fixture strings — deliberately NOT a whole-file path exemption, so any NEW
  # token-shaped string added to those files still fails the scan. The [ ]
  # single-char classes only keep THIS config file from being token-shaped
  # itself; they match the same literal fixture.
  '''^AKIAABCDEFGHIJKLMNO[P]$''',
  '''^ghp_abcdefghijklmnopqrstuvwxyz012345678[9]$''',
  # jwt.io debugger sample JWT (public documentation constant, truncated sig)
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf3[6]$''',
]
